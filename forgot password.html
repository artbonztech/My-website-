<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Artbonz Technologies</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:linear-gradient(135deg,#0056d6,#00a8ff);

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.forgot-container{

background:#fff;

width:420px;

max-width:100%;

padding:40px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.2);

text-align:center;

animation:fadeIn .8s;

}

.logo{

width:90px;

margin-bottom:20px;

}

h2{

color:#0056d6;

margin-bottom:10px;

}

.description{

color:#666;

line-height:1.6;

margin-bottom:30px;

}

.input-group{

position:relative;

margin-bottom:20px;

}

.input-group i{

position:absolute;

left:15px;

top:16px;

color:#777;

}

.input-group input{

width:100%;

padding:14px 14px 14px 45px;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

outline:none;

transition:.3s;

}

.input-group input:focus{

border-color:#0056d6;

}

.reset-btn{

width:100%;

padding:15px;

background:#0056d6;

color:#fff;

border:none;

border-radius:10px;

font-size:17px;

cursor:pointer;

transition:.3s;

}

.reset-btn:hover{

background:#003fa3;

}

.links{

display:flex;

justify-content:space-between;

margin-top:25px;

font-size:14px;

}

.links a{

text-decoration:none;

color:#0056d6;

font-weight:600;

}

.back-home{

margin-top:25px;

}

.back-home a{

text-decoration:none;

color:#333;

font-weight:bold;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="forgot-container">

<img src="images/logo.png"
class="logo"
alt="Artbonz Technologies Logo">

<h2>Forgot Password?</h2>

<p class="description">

Enter the email address associated with your account.
If your account exists, we'll send you instructions to reset your password.

</p>

<form action="forgot-password.php" method="POST">

<div class="input-group">

<i class="fas fa-envelope"></i>

<input
type="email"
name="email"
placeholder="Enter your Email Address"
required>

</div>

<button
type="submit"
class="reset-btn">

<i class="fas fa-paper-plane"></i>

Send Reset Link

</button>

</form>

<div class="links">

<a href="login.html">

<i class="fas fa-arrow-left"></i>

Back to Login

</a>

<a href="register.html">

Create Account

</a>

</div>

<div class="back-home">

<a href="index.html">

<i class="fas fa-home"></i>

Back to Home

</a>

</div>

</div>

</body>

</html>
