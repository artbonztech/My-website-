<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | Artbonz Technologies</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{

margin:0;
font-family:Arial,Helvetica,sans-serif;

background:linear-gradient(135deg,#0056d6,#00a8ff);

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.login-container{

background:#fff;

width:420px;

max-width:95%;

padding:40px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.2);

text-align:center;

animation:fadeIn .8s;

}

.login-logo{

width:90px;

margin-bottom:15px;

}

.login-container h2{

color:#0056d6;

margin-bottom:10px;

}

.login-container p{

color:#666;

margin-bottom:30px;

}

.input-group{

position:relative;

margin-bottom:20px;

}

.input-group i{

position:absolute;

left:15px;

top:16px;

color:#777;

}

.input-group input{

width:100%;

padding:14px 14px 14px 45px;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

outline:none;

box-sizing:border-box;

}

.input-group input:focus{

border-color:#0056d6;

}

.login-btn{

width:100%;

padding:15px;

background:#0056d6;

color:#fff;

border:none;

border-radius:10px;

font-size:17px;

cursor:pointer;

transition:.3s;

}

.login-btn:hover{

background:#003fa3;

}

.options{

display:flex;

justify-content:space-between;

margin-top:20px;

font-size:14px;

}

.options a{

text-decoration:none;

color:#0056d6;

}

.back-home{

margin-top:25px;

}

.back-home a{

text-decoration:none;

color:#333;

font-weight:bold;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="login-container">

<img src="Images/logo.png" class="login-logo" alt="Artbonz Technologies Logo">

<h2>Student Login</h2>

<p>Sign in to access your student dashboard.</p>

<form action="login.php" method="POST">

<div class="input-group">

<i class="fas fa-envelope"></i>

<input
type="email"
name="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<i class="fas fa-lock"></i>

<input
type="password"
name="password"
placeholder="Enter your password"
required>

</div>

<button
type="submit"
class="login-btn">

<i class="fas fa-sign-in-alt"></i>

Login

</button>

</form>

<div class="options">

<a href="forgot-password.html">

Forgot Password?

</a>

<a href="register.html">

Create Account

</a>

</div>

<div class="back-home">

<a href="index.html">

<i class="fas fa-arrow-left"></i>

Back to Home

</a>

</div>

</div>

</body>

</html>
